<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naše kytky 🌱</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f1b14">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kytky">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Outfit:wght@300;400;500;600&display=swap');
  :root{
    --bg:#0f1b14; --bg2:#16271d; --card:#1c3326; --card2:#22402f;
    --ink:#eaf3ec; --muted:#9fc0a9; --accent:#7bd88f; --accent2:#f2b84b;
    --danger:#e8836b; --water:#6cc5e8; --line:rgba(123,216,143,.18);
    --shadow:0 10px 40px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Outfit',sans-serif;background:radial-gradient(1200px 600px at 80% -10%, rgba(123,216,143,.10), transparent),radial-gradient(900px 500px at -10% 110%, rgba(242,184,75,.08), transparent),var(--bg);color:var(--ink);min-height:100vh;padding:24px 16px 80px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1100px;margin:0 auto}
  header.top{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:28px}
  .title h1{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(2rem,5vw,3.2rem);line-height:1;letter-spacing:-.02em}
  .title h1 .leaf{color:var(--accent)}
  .title p{color:var(--muted);margin-top:8px;font-weight:300;font-size:1.02rem}
  .tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  button{font-family:'Outfit',sans-serif;cursor:pointer;border:none;border-radius:12px;font-weight:500;transition:transform .12s ease, background .2s ease, box-shadow .2s}
  button:active{transform:scale(.96)}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:10px 16px;font-size:.9rem}
  .btn-ghost:hover{color:var(--ink);border-color:var(--accent)}
  .btn-ghost.on{color:var(--accent);border-color:var(--accent)}
  .season{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
  .season button{background:transparent;color:var(--muted);padding:8px 16px;border-radius:999px;font-size:.88rem}
  .season button.active{background:var(--accent);color:#0f1b14;font-weight:600}
  .season button.active.winter{background:var(--water);color:#0f1b14}
  .sync-pill{display:flex;align-items:center;gap:7px;font-size:.82rem;color:var(--muted);padding:6px 12px;border:1px solid var(--line);border-radius:999px}
  .sync-pill .d{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .sync-pill.busy .d{background:var(--accent2);animation:pulse 1s infinite}
  .sync-pill.err .d{background:var(--danger)}
  @keyframes pulse{50%{opacity:.3}}
  .summary{background:linear-gradient(135deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:18px;padding:18px 22px;margin-bottom:24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:var(--shadow)}
  .summary .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .summary .big{font-family:'Fraunces',serif;font-size:1.15rem;font-weight:600}
  .summary .sub{color:var(--muted);font-size:.92rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .card{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);position:relative;display:flex;flex-direction:column;transition:transform .15s ease, border-color .2s}
  .card:hover{transform:translateY(-3px);border-color:rgba(123,216,143,.4)}
  .photo-wrap{position:relative;cursor:pointer}
  .photo-wrap .photo{width:100%;height:180px;object-fit:cover;display:block;background:var(--bg2)}
  .photo-wrap .photo-emoji{width:100%;height:180px;display:flex;align-items:center;justify-content:center;font-size:3.6rem;background:linear-gradient(160deg,var(--card2),var(--bg2))}
  .photo-badge{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;padding:5px 11px;border-radius:999px;font-size:.8rem;font-weight:500;backdrop-filter:blur(4px);display:flex;align-items:center;gap:5px}
  .photo-wrap:hover .photo-badge{background:rgba(0,0,0,.75)}
  .card .body{padding:16px 22px 20px;flex:1;display:flex;flex-direction:column}
  .card h2{font-family:'Fraunces',serif;font-weight:600;font-size:1.35rem;letter-spacing:-.01em}
  .card .latin{color:var(--muted);font-style:italic;font-size:.85rem;margin-top:2px;margin-bottom:14px}
  .water-status{border-radius:14px;padding:12px 14px;margin-bottom:14px;background:rgba(0,0,0,.18);border:1px solid var(--line)}
  .water-status .when{font-weight:600;font-size:1rem;display:flex;align-items:center;gap:8px}
  .water-status .meta{color:var(--muted);font-size:.82rem;margin-top:3px}
  .status-ok .when{color:var(--accent)}
  .status-soon .when{color:var(--accent2)}
  .status-due .when{color:var(--danger)}
  .btn-water{background:var(--water);color:#0f1b14;padding:12px;width:100%;font-size:.95rem;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:6px}
  .btn-water:hover{box-shadow:0 6px 20px rgba(108,197,232,.35)}
  .btn-detail{background:transparent;color:var(--muted);border:1px solid var(--line);padding:10px;width:100%;font-size:.85rem}
  .btn-detail:hover{color:var(--ink);border-color:var(--accent)}
  .overlay{position:fixed;inset:0;background:rgba(5,12,8,.72);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .overlay.show{display:flex;animation:fade .2s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:22px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow);animation:pop .22s cubic-bezier(.2,.8,.2,1)}
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-head{padding:24px 26px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:linear-gradient(160deg,var(--card),var(--bg2));display:flex;align-items:center;gap:14px;z-index:2}
  .modal-head .thumb{width:52px;height:52px;border-radius:13px;object-fit:cover;flex-shrink:0;background:var(--bg2)}
  .modal-head .thumb-emoji{width:52px;height:52px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:2rem;background:rgba(0,0,0,.22);flex-shrink:0}
  .modal-head h2{font-family:'Fraunces',serif;font-weight:600;font-size:1.5rem}
  .modal-head .latin{color:var(--muted);font-style:italic;font-size:.85rem}
  .modal-close{margin-left:auto;background:rgba(0,0,0,.25);color:var(--ink);width:36px;height:36px;border-radius:10px;font-size:1.1rem;flex-shrink:0}
  .modal-body{padding:8px 26px 26px}
  .care-row{padding:14px 0;border-bottom:1px solid var(--line)}
  .care-row:last-child{border-bottom:none}
  .care-row .k{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.92rem;color:var(--accent);margin-bottom:4px}
  .care-row .v{color:var(--ink);font-weight:300;line-height:1.5;font-size:.95rem}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.75rem;font-weight:500;background:rgba(123,216,143,.15);color:var(--accent);border:1px solid var(--line)}
  .warn-box{background:rgba(232,131,107,.12);border:1px solid rgba(232,131,107,.3);border-radius:12px;padding:12px 14px;margin-top:14px}
  .warn-box .k{color:var(--danger)}
  .hint-box{background:rgba(108,197,232,.10);border:1px solid rgba(108,197,232,.3);border-radius:12px;padding:12px 14px;margin-top:14px;color:var(--ink);font-weight:300;font-size:.92rem;line-height:1.5}
  .gal-wrap{position:relative}
  .gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:16px;background:#000;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .gallery::-webkit-scrollbar{display:none}
  .slide{flex:0 0 100%;scroll-snap-align:center;position:relative}
  .slide img{width:100%;height:360px;object-fit:contain;display:block;background:#000}
  .slide .cap{position:absolute;bottom:0;left:0;right:0;padding:10px 14px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:.85rem;display:flex;justify-content:space-between;align-items:center}
  .slide .del{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.25);color:#fff;width:32px;height:32px;border-radius:9px;font-size:.95rem}
  .gal-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.45);color:#fff;width:40px;height:40px;border-radius:50%;font-size:1.4rem;line-height:1;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);z-index:3}
  .gal-arrow.left{left:8px} .gal-arrow.right{right:8px}
  .gal-count{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;padding:4px 12px;border-radius:999px;font-size:.8rem;backdrop-filter:blur(4px);z-index:3}
  .gal-empty{text-align:center;padding:48px 16px;color:var(--muted);background:rgba(0,0,0,.18);border:1px dashed var(--line);border-radius:16px;font-size:1.05rem;line-height:1.7}
  .gal-empty span{font-size:.9rem}
  .gal-hint{color:var(--muted);font-size:.85rem;font-weight:300;line-height:1.5;margin-top:12px;text-align:center}
  footer{text-align:center;color:var(--muted);font-size:.82rem;margin-top:40px;font-weight:300}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--accent);color:#0f1b14;padding:14px 22px;border-radius:14px;font-weight:600;box-shadow:var(--shadow);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:60;max-width:90%;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div class="title">
      <h1>Naše <span class="leaf">kytky</span></h1>
      <p>Přehled péče &amp; připomínání zálivky</p>
    </div>
    <div class="tools">
      <div class="sync-pill" id="syncPill"><span class="d"></span><span id="syncText">Načítám…</span></div>
      <button class="btn-ghost" id="notifyBtn" onclick="enableNotifications()">🔔 Oznámení</button>
      <div class="season" id="seasonToggle">
        <button data-season="summer" class="active">☀️ Léto</button>
        <button data-season="winter">❄️ Zima</button>
      </div>
    </div>
  </header>
  <div class="summary" id="summary"></div>
  <div class="grid" id="grid"></div>
  <footer>Vytvořeno s láskou k rostlinám 🌿 · Data se synchronizují mezi vámi dvěma</footer>
</div>

<div class="overlay" id="detailOverlay" onclick="if(event.target===this)closeDetail()">
  <div class="modal" id="detailModal"></div>
</div>
<div class="overlay" id="galleryOverlay" onclick="if(event.target===this)closeGallery()">
  <div class="modal" id="galleryModal"></div>
</div>
<input type="file" accept="image/*" id="photoInput" style="display:none">
<div class="toast" id="toast"></div>

<script>
const PLANTS = [
  {id:'kaktus', emoji:'🌵', name:'Roubovaný kaktus', latin:'Gymnocalycium mihanovichii', difficulty:'Střední',
   water:{summer:10, winter:35},
   care:{'Zálivka – léto':'Cca 1× za 1–2 týdny. Vždy nech substrát úplně vyschnout. Lij ke kořenům, ne na tělo.','Zálivka – zima':'Minimálně, 1× za 4–6 týdnů jen trochu.','Voda':'Běžná kohoutková je v pohodě.','Umístění':'Hodně světla, ale ne pálivé polední slunce. Ideál východní/západní okno.','Substrát':'Kaktusový/sukulentní + perlit nebo hrubý písek (cca 1/3).','Přesazování':'1× za 2–3 roky na jaře, o trochu větší květináč s odtokem.','Hnojení':'Minimálně, kaktusové hnojivo na jaře.','Teplota v zimě':'Min. 10–15 °C, nesnese mráz.'},
   warn:'Barevná korunka nemá chlorofyl a žije z naroubovaného zeleného podnože. Tyto kaktusy mají omezenou životnost (2–4 roky). Měkké/hnědnoucí skvrny = příliš vody.'},
  {id:'mucholapka', emoji:'🪰', name:'Mucholapka podivná', latin:'Dionaea muscipula', difficulty:'Náročnější',
   water:{summer:2, winter:7},
   care:{'Zálivka – léto':'Musí být STÁLE vlhká, nikdy nesmí vyschnout! Nejlépe podmiskování (1–2 cm vody v misce).','Zálivka – zima':'Mírně vlhká během období spánku.','Voda':'POUZE dešťová nebo destilovaná! Kohoutková voda ji zabije.','Umístění':'Plné přímé slunce, min. 4–6 hodin denně. Nejslunečnější okno.','Substrát':'Speciální pro masožravky (rašelina + perlit). Nikdy běžná hlína!','Přesazování':'1× za 1–2 roky brzy na jaře.','Hnojení':'NIKDY nehnojit. Živiny získává z hmyzu.','Teplota v zimě':'Chladný spánek 5–10 °C (listopad–únor) je NUTNÝ.'},
   warn:'Nešťouchej do pastí pro zábavu — každé sklapnutí ji stojí energii a past po pár sklapnutích odumře. Venku si chytí hmyz sama. Bez zimního spánku časem uhyne. Černající pasti v zimě jsou normální.'},
  {id:'hawortie', emoji:'🌿', name:'Hawortie (zebří)', latin:'Haworthia fasciata / attenuata', difficulty:'Velmi snadná',
   water:{summer:10, winter:25},
   care:{'Zálivka – léto':'1× za 1–2 týdny, nech nejdřív pořádně vyschnout. Lij ke kořenům, ne do růžice.','Zálivka – zima':'1× za 3–4 týdny.','Voda':'Běžná kohoutková.','Umístění':'Jasné nepřímé světlo, snese i polostín. Skvělá na stůl. Ostré polední slunce pálí listy.','Substrát':'Kaktusový/sukulentní + perlit nebo písek.','Přesazování':'1× za 2–3 roky na jaře. Roste pomalu.','Hnojení':'1–2× za sezónu slabým sukulentním hnojivem.','Teplota v zimě':'Pokojová, nedávat pod 5 °C.'},
   warn:'Průsvitné/měkké listy = přelití. Krčí se a vrásní = potřebuje zalít. Dělá odnože u základny — lze je oddělit a množit.'},
  {id:'juka', emoji:'🌴', name:'Juka sloní', latin:'Yucca elephantipes', difficulty:'Snadná',
   water:{summer:10, winter:28},
   care:{'Zálivka – léto':'1× za 1–2 týdny, nech vyschnout horní třetinu až polovinu substrátu.','Zálivka – zima':'1× za 3–4 týdny.','Voda':'Běžná kohoutková.','Umístění':'Co nejvíc světla, ideálně přímé slunce. V létě jí prospěje pobyt venku (postupně navykat).','Substrát':'Propustný univerzál + písek nebo perlit. Nutný odtok!','Přesazování':'1× za 2–3 roky na jaře, do těžšího květináče (ať se nepřevrhne).','Hnojení':'Sukulentní/zelené hnojivo v sezóně.','Teplota v zimě':'Pokojová, ideál 10–15 °C. Ne k topení.'},
   warn:'Přelití → měkký kmen a hniloba (nejčastější příčina úhynu). Spodní listy přirozeně žloutnou a opadávají, to je normální. Listy jsou mírně toxické při pozření (pozor na děti/zvířata).'},
  {id:'avokado', emoji:'🥑', name:'Avokádo (Persea americana)', latin:'Persea americana', difficulty:'Projekt z pecky', project:true,
   phases:[
     {name:'1 · Klíčení v sáčku', interval:5, task:'Zkontroluj vlhkost utěrky — má být vlhká, ne mokrá. Případně otři plíseň a utěrku navlhči/vyměň. Drž ve tmě a v teple (20–25 °C).', next:'Až pecka praskne a vyraší kořínek ~3–5 cm, přejdi do fáze 2.'},
     {name:'2 · Kořínek ve vodě', interval:7, task:'Pecku dej do sklenice tak, aby spodní třetina byla ve vodě (zápichy/párátka jako opora). Postav na světlo (ne přímé slunce). Vyměň vodu cca 1× týdně.', next:'Až vyroste stonek ~15 cm, přejdi do fáze 3.'},
     {name:'3 · Stonek a listy', interval:7, task:'Když je stonek ~15 cm, zaštípni vršek (asi na 8 cm), ať se větví. Doplňuj vodu. Sleduj listy.', next:'Až má pár listů a silnější kořeny, přejdi do fáze 4.'},
     {name:'4 · Zasazeno v hlíně', interval:7, task:'Zasaď do propustného substrátu, pecku nech z poloviny nad hlínou. Zalévej, ať je hlína mírně vlhká. Hodně světla.', next:'Hotovo — teď už roste jako stromek. 🌳'}
   ],
   care:{'Voda':'Klíčení/voda: vlhko, ne mokro. Po zasazení mírně vlhká hlína.','Umístění':'Fáze klíčení ve tmě a v teple; pak hodně světla (ne ostré polední slunce).','Teplota':'Teplo 20–25 °C urychlí klíčení. Nesnese chlad.','Substrát (fáze 4)':'Propustný univerzál + trochu písku/perlitu, květináč s odtokem.','Trpělivost':'Klíčení trvá klidně 2–6 týdnů, někdy déle. Každá pecka má svoje tempo.','Zaštipování':'Po dosažení ~15 cm zaštípnout vršek — donutí to rostlinu se větvit, jinak roste jako hůl.'},
   warn:'Z pecky vypěstovaný stromek doma většinou neplodí (a pokud, tak po mnoha letech) — ber to jako parádní okrasný projekt. Listy a pecka avokáda jsou mírně toxické pro psy, kočky a koně, pozor na mazlíčky.'}
];

const PHOTO_EXTS = ['jpg','jpeg','png','webp'];
let season = 'summer';
let state = {};
let photoIndex = {};
let avokadoPhase = 1;   // aktuální fáze avokáda (1–4)

function intervalFor(plant){
  if(plant.project && plant.phases){
    const ph = plant.phases[Math.min(avokadoPhase, plant.phases.length) - 1];
    return ph ? ph.interval : 5;
  }
  return plant.water[season];
}

function photoCandidates(p){
  const c = [];
  const idx = photoIndex[p.id];
  if(idx && idx.latestId) c.push(`/api/photo?id=${idx.latestId}`);
  PHOTO_EXTS.forEach(e=>c.push(`${p.id}.${e}`));
  return c;
}
function imgHTML(p, cls){
  const c = photoCandidates(p);
  const rest = c.slice(1).join('|');
  return `<img class="${cls}" src="${c[0]}" alt="${p.name}" loading="lazy" data-cands="${rest}" data-emoji="${p.emoji}" data-cls="${cls}" onerror="imgErr(this)">`;
}
function imgErr(img){
  const rest = (img.dataset.cands||'').split('|').filter(Boolean);
  if(rest.length){
    const next = rest.shift();
    img.dataset.cands = rest.join('|');
    img.src = next;
  } else {
    const d = document.createElement('div');
    d.className = (img.dataset.cls||'photo') + '-emoji';
    d.textContent = img.dataset.emoji || '🌱';
    if(img.parentNode) img.replaceWith(d);
  }
}

async function fetchState(){
  setSync('busy','Načítám…');
  try{
    const r = await fetch('/api/state');
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data = await r.json();
    state = data.watering || {};
    if(data.season === 'summer' || data.season === 'winter'){ season = data.season; applySeasonButtons(); }
    if(data.avokadoPhase){ avokadoPhase = Math.max(1, Math.min(4, parseInt(data.avokadoPhase,10)||1)); }
    setSync('ok','Synchronizováno');
    return true;
  }catch(e){ setSync('err','Offline'); return false; }
}
async function fetchPhotoIndex(){
  try{ const r = await fetch('/api/photos'); if(r.ok) photoIndex = await r.json(); }catch(e){}
}
async function pushWater(plantId, iso){
  setSync('busy','Ukládám…');
  try{
    const r = await fetch('/api/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plantId, lastWatered: iso})});
    if(!r.ok) throw new Error('HTTP '+r.status);
    setSync('ok','Synchronizováno'); return true;
  }catch(e){ setSync('err','Chyba uložení'); return false; }
}
async function pushSeason(s){
  try{ await fetch('/api/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({season:s})}); }catch(e){}
}
function setSync(cls, text){
  const p = document.getElementById('syncPill');
  p.className = 'sync-pill' + (cls==='busy'?' busy':cls==='err'?' err':'');
  document.getElementById('syncText').textContent = text;
}

function isiOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent); }
function isStandalone(){ return window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches; }
function urlB64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i);
  return arr;
}
async function enableNotifications(){
  if(isiOS() && !isStandalone()){
    showInfoModal('📲 Ještě jeden krok na iPhonu',
      'Aby na iPhonu chodila oznámení, musíš appku nejdřív přidat na plochu a otevřít ji z té ikony:<br><br>'
      +'1. Dole klepni na ikonu <b>Sdílet</b> (čtvereček se šipkou ↑).<br>'
      +'2. Vyber <b>Přidat na plochu</b>.<br>'
      +'3. Otevři appku z nové ikony na ploše.<br>'
      +'4. Tam znovu klepni na <b>🔔 Oznámení</b>.<br><br>'
      +'Tohle je bohužel podmínka Applu, nedá se obejít.');
    return;
  }
  if(!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)){
    showToast('⚠️ Tento prohlížeč oznámení nepodporuje'); return;
  }
  try{
    const reg = await navigator.serviceWorker.ready;
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){ showToast('Oznámení nebyla povolena'); return; }
    const keyResp = await fetch('/api/subscribe');
    const { publicKey } = await keyResp.json();
    if(!publicKey){ showToast('⚠️ Chybí klíč pro oznámení'); return; }
    let sub = await reg.pushManager.getSubscription();
    if(!sub){ sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: urlB64ToUint8Array(publicKey) }); }
    const r = await fetch('/api/subscribe', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(sub)});
    if(!r.ok) throw new Error('save failed');
    markNotifyOn(); showToast('🔔 Oznámení zapnutá!');
  }catch(e){ showToast('⚠️ Oznámení se nepodařilo zapnout'); }
}
function markNotifyOn(){ const b = document.getElementById('notifyBtn'); b.classList.add('on'); b.textContent = '🔔 Oznámení zapnutá'; }

function daysUntilNext(plant){
  const st = state[plant.id];
  const interval = intervalFor(plant);
  if(!st || !st.lastWatered) return null;
  const last = new Date(st.lastWatered);
  const next = new Date(last.getTime() + interval*86400000);
  return Math.ceil((next - new Date())/86400000);
}
function statusFor(plant){
  const d = daysUntilNext(plant);
  const proj = plant.project;
  const verb = proj ? 'Zkontrolovat' : 'Zalít';
  if(d===null) return {cls:'status-soon', text:proj?'Zatím nezkontrolováno':'Zatím nezalito', icon:'💧'};
  if(d<=0) return {cls:'status-due', text:(d===0?(proj?'Zkontrolovat dnes!':'Zalít dnes!'):`Po termínu o ${Math.abs(d)} d`), icon:'⚠️'};
  if(d<=2) return {cls:'status-soon', text:`${verb} za ${d} ${dni(d)}`, icon:'🔔'};
  return {cls:'status-ok', text:`${verb} za ${d} ${dni(d)}`, icon:'✅'};
}
function dni(n){ if(n===1)return 'den'; if(n>=2&&n<=4)return 'dny'; return 'dní'; }
function fotek(n){ if(n===1)return 'fotka'; if(n>=2&&n<=4)return 'fotky'; return 'fotek'; }
function fmtDate(iso){ if(!iso)return '—'; return new Date(iso).toLocaleDateString('cs-CZ',{day:'numeric',month:'numeric',year:'numeric'}); }

function render(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  PLANTS.forEach(p=>{
    const s = statusFor(p);
    const st = state[p.id];
    const count = (photoIndex[p.id] && photoIndex[p.id].count) || 0;
    const card = document.createElement('div');
    card.className='card';
    if(p.project){
      const ph = p.phases[Math.min(avokadoPhase, p.phases.length)-1];
      const isLast = avokadoPhase >= p.phases.length;
      card.innerHTML = `
        <div class="photo-wrap" onclick="openGallery('${p.id}')">
          ${imgHTML(p,'photo')}
          <div class="photo-badge">📷 ${count}</div>
        </div>
        <div class="body">
          <h2>${p.name}</h2>
          <div class="latin">Fáze ${avokadoPhase}/${p.phases.length} · ${ph.name.replace(/^\d+ · /,'')}</div>
          <div class="water-status ${s.cls}">
            <div class="when">${s.icon} ${s.text}</div>
            <div class="meta">Naposledy: ${fmtDate(st&&st.lastWatered)} · kontrola á ${intervalFor(p)} dní</div>
          </div>
          <button class="btn-water" onclick="water('${p.id}')">✅ Zkontrolováno</button>
          ${isLast ? '' : `<button class="btn-detail" style="margin-bottom:6px;border-color:var(--accent);color:var(--accent)" onclick="advancePhase()">➡️ Další fáze</button>`}
          <button class="btn-detail" onclick="openDetail('${p.id}')">📖 Plán &amp; péče</button>
        </div>`;
    } else {
      card.innerHTML = `
        <div class="photo-wrap" onclick="openGallery('${p.id}')">
          ${imgHTML(p,'photo')}
          <div class="photo-badge">📷 ${count}</div>
        </div>
        <div class="body">
          <h2>${p.name}</h2>
          <div class="latin">${p.latin}</div>
          <div class="water-status ${s.cls}">
            <div class="when">${s.icon} ${s.text}</div>
            <div class="meta">Naposledy: ${fmtDate(st&&st.lastWatered)} · interval ${p.water[season]} dní</div>
          </div>
          <button class="btn-water" onclick="water('${p.id}')">💧 Zalito</button>
          <button class="btn-detail" onclick="openDetail('${p.id}')">📖 Karta péče</button>
        </div>`;
    }
    grid.appendChild(card);
  });
  renderSummary();
}
function renderSummary(){
  let due=0, soon=0;
  PLANTS.forEach(p=>{ const d=daysUntilNext(p); if(d!==null&&d<=0)due++; else if(d!==null&&d<=2)soon++; });
  const el = document.getElementById('summary');
  let color, big, sub;
  if(due>0){ color='var(--danger)'; big=`${due} ${due===1?'kytka potřebuje':'kytky/kytek potřebují'} zalít`; sub='Mrkni na červené karty níže.'; }
  else if(soon>0){ color='var(--accent2)'; big=`${soon} ${soon===1?'kytka':'kytky'} brzy na řadě`; sub='Zatím nic akutního, ale připrav konev.'; }
  else { color='var(--accent)'; big='Všechno v pohodě 🌿'; sub='Žádná kytka teď nepotřebuje zalít.'; }
  el.innerHTML = `<span class="dot" style="background:${color}"></span><div><div class="big">${big}</div><div class="sub">${sub}</div></div>`;
}
async function water(id){
  const iso = new Date().toISOString();
  const prev = state[id];
  const plant = PLANTS.find(x=>x.id===id);
  state[id] = {lastWatered: iso};
  render();
  showToast(plant && plant.project ? '✅ Kontrola zapsána!' : '💧 Zapsáno! Hodná kytka.');
  const ok = await pushWater(id, iso);
  if(!ok){ state[id]=prev; render(); showToast('⚠️ Nepodařilo se uložit'); }
}

async function pushPhase(n){
  try{ await fetch('/api/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({avokadoPhase:n})}); }catch(e){}
}
async function advancePhase(){
  const p = PLANTS.find(x=>x.project);
  if(!p) return;
  if(avokadoPhase >= p.phases.length){ showToast('🌳 Avokádo je v poslední fázi'); return; }
  if(!confirm('Posunout avokádo do další fáze?')) return;
  avokadoPhase += 1;
  render();
  showToast(`➡️ Fáze ${avokadoPhase}: ${p.phases[avokadoPhase-1].name.replace(/^\d+ · /,'')}`);
  await pushPhase(avokadoPhase);
}

function openDetail(id){
  const p = PLANTS.find(x=>x.id===id);
  const m = document.getElementById('detailModal');
  let rows='';
  for(const [k,v] of Object.entries(p.care)){
    rows += `<div class="care-row"><div class="k">${iconFor(k)} ${k}</div><div class="v">${v}</div></div>`;
  }
  let phasesHtml = '';
  if(p.project && p.phases){
    let items = '';
    p.phases.forEach((ph, i)=>{
      const n = i+1;
      const cur = n===avokadoPhase;
      const done = n < avokadoPhase;
      const mark = done ? '✅' : (cur ? '👉' : '⏳');
      const col = cur ? 'var(--accent)' : (done ? 'var(--muted)' : 'var(--ink)');
      items += `<div class="care-row"><div class="k" style="color:${col}">${mark} ${ph.name}${cur?' — teď':''}</div><div class="v">${ph.task}<br><span style="color:var(--muted)">${ph.next}</span></div></div>`;
    });
    phasesHtml = `<div class="hint-box" style="margin-bottom:6px"><b>Růstový plán</b> — appka ti připomene kontrolu podle aktuální fáze (teď fáze ${avokadoPhase}/${p.phases.length}). Až bude čas, posuň „Další fáze" na kartě.</div>${items}`;
  }
  m.innerHTML = `
    <div class="modal-head">${imgHTML(p,'thumb')}
      <div><h2>${p.name}</h2><div class="latin">${p.latin}</div></div>
      <button class="modal-close" onclick="closeDetail()">✕</button></div>
    <div class="modal-body"><span class="badge">Náročnost: ${p.difficulty}</span>
      ${phasesHtml ? `<div style="margin-top:14px">${phasesHtml}</div>` : ''}
      <div style="margin-top:14px">${rows}</div>
      <div class="warn-box"><div class="k" style="font-weight:600;margin-bottom:4px">⚠️ Dobré vědět</div><div class="v" style="font-weight:300;line-height:1.5">${p.warn}</div></div>
    </div>`;
  document.getElementById('detailOverlay').classList.add('show');
}
function showInfoModal(title, html){
  const m = document.getElementById('detailModal');
  m.innerHTML = `
    <div class="modal-head"><span class="thumb-emoji">🔔</span>
      <div><h2>${title}</h2></div>
      <button class="modal-close" onclick="closeDetail()">✕</button></div>
    <div class="modal-body"><div class="hint-box">${html}</div></div>`;
  document.getElementById('detailOverlay').classList.add('show');
}
function iconFor(k){
  if(k.includes('Zálivka'))return '💧'; if(k.includes('Voda'))return '🚰';
  if(k.includes('Umístění'))return '☀️'; if(k.includes('Substrát'))return '🪴';
  if(k.includes('Přesaz'))return '🌱'; if(k.includes('Hnojení'))return '🧪';
  if(k.includes('Teplota'))return '🌡️'; return '•';
}
function closeDetail(){ document.getElementById('detailOverlay').classList.remove('show'); }

let currentGalleryPlant = null;
async function openGallery(id, jumpToEnd){
  currentGalleryPlant = id;
  const p = PLANTS.find(x=>x.id===id);
  let photos = [];
  try{ const r = await fetch(`/api/photos?plant=${id}`); if(r.ok) photos = await r.json(); }catch(e){}
  let slides = '';
  photos.forEach(ph=>{
    const d = fmtDate(ph.created_at);
    slides += `<div class="slide"><img src="/api/photo?id=${ph.id}" alt="" loading="lazy"><div class="cap"><span>📅 ${d}</span><button class="del" onclick="deletePhoto(${ph.id},'${id}')">🗑</button></div></div>`;
  });
  const body = photos.length
    ? `<div class="gal-wrap">
         ${photos.length>1?'<button class="gal-arrow left" onclick="galScroll(-1)">‹</button>':''}
         <div class="gallery" id="galleryStrip" onscroll="galOnScroll()">${slides}</div>
         ${photos.length>1?'<button class="gal-arrow right" onclick="galScroll(1)">›</button>':''}
         <div class="gal-count" id="galCount">1 / ${photos.length}</div>
       </div>`
    : `<div class="gal-empty">Zatím žádné fotky 🌱<br><span>Přidej první a sleduj, jak roste!</span></div>`;
  const m = document.getElementById('galleryModal');
  m.innerHTML = `
    <div class="modal-head">${imgHTML(p,'thumb')}
      <div><h2>${p.name}</h2><div class="latin">Růstová galerie · ${photos.length} ${fotek(photos.length)}</div></div>
      <button class="modal-close" onclick="closeGallery()">✕</button></div>
    <div class="modal-body">
      ${body}
      <button class="btn-water" style="margin-top:16px" onclick="pickPhoto('${id}')">📷 Přidat fotku</button>
      <p class="gal-hint">Tip: focení ze stejného místa a úhlu pomáhá hezky porovnat růst. 🌿</p>
    </div>`;
  document.getElementById('galleryOverlay').classList.add('show');
  if(jumpToEnd){
    setTimeout(()=>{ const s=document.getElementById('galleryStrip'); if(s){ s.scrollLeft=s.scrollWidth; galOnScroll(); } }, 60);
  }
}
function closeGallery(){ document.getElementById('galleryOverlay').classList.remove('show'); }
function galScroll(dir){
  const s = document.getElementById('galleryStrip'); if(!s) return;
  s.scrollBy({ left: dir*s.clientWidth, behavior:'smooth' });
}
function galOnScroll(){
  const s = document.getElementById('galleryStrip'); if(!s) return;
  const total = s.children.length;
  const i = Math.min(Math.round(s.scrollLeft / s.clientWidth)+1, total);
  const c = document.getElementById('galCount'); if(c) c.textContent = `${i} / ${total}`;
}

function pickPhoto(plantId){
  const inp = document.getElementById('photoInput');
  inp.onchange = ()=>{
    const f = inp.files && inp.files[0];
    inp.value = '';
    if(f) addPhoto(plantId, f);
  };
  inp.click();
}
function fileToResizedDataURL(file, maxSide, quality){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      let w = img.naturalWidth, h = img.naturalHeight;
      if(Math.max(w,h) > maxSide){
        if(w>=h){ h = Math.round(h*maxSide/w); w = maxSide; }
        else { w = Math.round(w*maxSide/h); h = maxSide; }
      }
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(cv.toDataURL('image/jpeg', quality));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('Obrázek nelze načíst')); };
    img.src = url;
  });
}
async function addPhoto(plantId, file){
  showToast('📷 Nahrávám fotku…');
  try{
    const dataUrl = await fileToResizedDataURL(file, 1100, 0.72);
    const r = await fetch('/api/photos', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plantId, data:dataUrl})});
    if(!r.ok) throw new Error('upload');
    await fetchPhotoIndex();
    render();
    await openGallery(plantId, true);
    showToast('✅ Fotka přidána!');
  }catch(e){ showToast('⚠️ Nahrání se nepovedlo (zkus jpg/png, ne HEIC)'); }
}
async function deletePhoto(photoId, plantId){
  if(!confirm('Opravdu smazat tuhle fotku?')) return;
  try{
    const r = await fetch(`/api/photos?id=${photoId}`, {method:'DELETE'});
    if(!r.ok) throw new Error('del');
    await fetchPhotoIndex();
    render();
    openGallery(plantId);
    showToast('🗑 Fotka smazána');
  }catch(e){ showToast('⚠️ Smazání se nepovedlo'); }
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'),2600);
}
function applySeasonButtons(){
  document.querySelectorAll('#seasonToggle button').forEach(b=>{
    b.classList.toggle('active', b.dataset.season===season);
    b.classList.toggle('winter', season==='winter' && b.dataset.season==='winter');
  });
}
document.getElementById('seasonToggle').addEventListener('click',e=>{
  if(e.target.dataset.season){
    season = e.target.dataset.season;
    applySeasonButtons(); render(); pushSeason(season);
  }
});
if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').catch(()=>{}); }
function refreshNotifyButton(){ if('Notification' in window && Notification.permission === 'granted'){ markNotifyOn(); } }

(async function init(){
  await fetchState();
  await fetchPhotoIndex();
  render();
  refreshNotifyButton();
})();
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden){ Promise.all([fetchState(), fetchPhotoIndex()]).then(()=>render()); }
});
</script>
</body>
